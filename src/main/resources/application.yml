server:
  port: 8080

spring:
  application:
    name: banking-transaction-system

  datasource:
    # Override with environment variables (DB_URL, DB_USERNAME, DB_PASSWORD) when needed
    url: ${DB_URL:jdbc:postgresql://localhost:5433/banking}
    username: ${DB_USERNAME:banking}
    password: ${DB_PASSWORD:banking}
    hikari:
      maximum-pool-size: 20

  jpa:
    # Schema is owned by Flyway migrations; Hibernate only validates it matches the entities
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # Development secret only. Set JWT_SECRET (32+ characters) in any real deployment.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789-abcdefghijklmnop}
    expiration-minutes: 60
  admin:
    username: admin
    password: ${ADMIN_PASSWORD:Admin@123}
  cors:
    allowed-origins: http://localhost:5173

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.anil.banking: INFO
