services:
  db:
    image: postgres:16
    container_name: banking-db
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking
    ports:
      # Host port 5433 avoids clashing with a PostgreSQL installed directly on the PC
      - "5433:5432"
    volumes:
      - banking-data:/var/lib/postgresql/data
      # Creates the separate banking_test database used by the tests
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking -d banking"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: banking-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/banking
      DB_USERNAME: banking
      DB_PASSWORD: banking
    ports:
      - "8080:8080"

  # Database UI in the browser: http://localhost:5050 (login: admin@banking.com / admin)
  pgadmin:
    image: dpage/pgadmin4
    container_name: banking-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@banking.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      # Pre-registers the banking database so it appears in pgAdmin automatically
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - db

volumes:
  banking-data:
